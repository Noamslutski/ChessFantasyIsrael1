plugins {
    id 'com.android.application'
}

android {
    namespace 'com.chessfantasy.israel'
    compileSdk 34

    // parse.bot player-search API key — never hard-coded. Provide it via
    // gradle property (-PPARSE_API_KEY=..., local.properties, ~/.gradle) or the
    // PARSE_API_KEY environment variable. Defaults to empty (feature disabled).
    def parseApiKey = project.findProperty('PARSE_API_KEY') ?: System.getenv('PARSE_API_KEY') ?: ''

    defaultConfig {
        applicationId "com.chessfantasy.israel"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        buildConfigField "String", "PARSE_API_KEY", "\"${parseApiKey}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.code.gson:gson:2.10.1'
}
